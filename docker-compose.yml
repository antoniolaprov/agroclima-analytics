services:
  airflow:
    build: .
    # No Linux, AIRFLOW_UID no .env deve ser o seu `id -u`: dbt/ e data/ sao
    # montados do host e o container precisa escrever neles.
    user: "${AIRFLOW_UID:-50000}:0"
    command: bash /opt/airflow/airflow/iniciar.sh
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/airflow/dags
      # A DAG ja nasce ativa; pausada, o agendamento diario nunca comecaria.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Banco e logs de tarefa no volume airflow_estado: recriar o container
      # nao apaga o historico de execucoes nem o usuario.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/estado/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/estado/logs
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      # target/ e logs/ do dbt ficam fora do volume dbt/: o cache de parse que o
      # dbt grava ao rodar no Windows guarda caminhos com barra invertida e
      # quebra o dbt do container quando os dois compartilham o mesmo target/.
      DBT_TARGET_PATH: /opt/airflow/dbt_artifacts/target
      DBT_LOG_PATH: /opt/airflow/dbt_artifacts/logs
    volumes:
      - ./airflow:/opt/airflow/airflow
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./tests:/opt/airflow/tests
      - airflow_estado:/opt/airflow/estado
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - airflow

volumes:
  airflow_estado:
