services:
  airflow:
    build: .
    # dbt/ e montado como volume (abaixo), por cima do que a imagem tenha
    # instalado em build time - entao dbt_packages (gitignored, exigido
    # pelos testes com dbt_utils) precisa ser recriado aqui, na inicializacao
    # do container, e nao no Dockerfile. "exec airflow standalone" retoma o
    # fluxo normal do entrypoint da imagem apos o dbt deps.
    command: >
      bash -c "python -m dbt.cli.main deps --project-dir /opt/airflow/dbt --profiles-dir /opt/airflow/dbt && exec airflow standalone"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/airflow/dags
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ./airflow:/opt/airflow/airflow
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./tests:/opt/airflow/tests
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      - airflow
